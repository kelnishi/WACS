[package]
name = "wasi-webgpu-game-of-life"
version = "0.1.0"
edition = "2021"
publish = false

# Conway's Game of Life parity fixture for WACS.WASI.GFX.Webgpu.
# Runs 2 steps of GoL on an 8×8 torus grid seeded with a
# blinker oscillator, verifies the state returns to the initial
# pattern after one full oscillation period. Exercises:
#   - Two storage buffers ping-ponged across compute passes
#   - Bind-group-layout with multiple entries (read-only +
#     read-write storage)
#   - Two bind groups sharing the same layout but with the
#     buffers swapped
#   - Multiple compute passes in one command encoder
#   - Buffer copy + map-read readback
# Together with hello-compute (kernel correctness) and
# hello-render (graphics pipeline), this rounds out the parity
# matrix.

[dependencies]
wit-bindgen = "0.41"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
strip = true
